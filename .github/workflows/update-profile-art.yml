name: Update profile art

# Refreshes the contribution graph SVG daily from real public HTML.
# Portrait + info card are static — regenerate locally when content changes.

"on":
  schedule:
    - cron: "17 6 * * *"   # ~06:17 UTC daily
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install heatmap dependencies
        run: pip install -r scripts/requirements-ci.txt

      - name: Scrape real contribution data (no auth needed)
        env:
          GH_PROFILE_USER: ${{ github.repository_owner }}
        run: python scripts/fetch_contributions.py

      - name: Render animated contribution graph SVG
        env:
          GH_PROFILE_USER: ${{ github.repository_owner }}
        run: python scripts/render_heatmap_svg.py

      - name: Commit updated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg"
